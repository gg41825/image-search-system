apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: image-search-system
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 600
      containers:
      - image: DOCKER_IMAGE_PLACEHOLDER
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: DEV_MODE
          value: "0"
        - name: MONGO_URI
          value: "MONGO_URI_PLACEHOLDER"
        - name: IMG_UPLOAD_DIR
          value: "/tmp/uploads"
        - name: SAMPLE_SIZE
          value: "SAMPLE_SIZE_PLACEHOLDER"
        - name: INDEX_PATH
          value: "/app/data/cache/aligned_index.ann"
        - name: ID_MAP_PATH
          value: "/app/data/cache/id_map.json"
        resources:
          limits:
            cpu: '2'
            memory: 8Gi
        startupProbe:
          timeoutSeconds: 5
          periodSeconds: 15
          failureThreshold: 240
          tcpSocket:
            port: 8080
  traffic:
  - percent: 100
    latestRevision: true